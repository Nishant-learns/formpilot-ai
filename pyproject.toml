[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "formpilot-ai"
version = "1.0.0"
description = "Autonomous Form Operations Engine with Human Oversight for High-Stakes Public Portals"
readme = "README.md"
authors = [{ name = "FormPilot Engineering Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "playwright>=1.40.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "httpx>=0.24.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "coverage>=7.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*"]
